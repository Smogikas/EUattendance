name: Arenas dump (vienkartinis)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp
          curl -sL "https://docs.google.com/spreadsheets/d/1Qt4ijFGDmvoLLHb-gCbcAF9KGts6ZC-RHwWzQw68cZI/gviz/tq?tqx=out:csv&headers=1&sheet=Arenas" -o tmp/arenas.csv
          git config user.name attendance-bot; git config user.email attendance-bot@users.noreply.github.com
          git add tmp && git commit -m "tmp arenas dump" && git push
