name: Arenų talpos tyrimas (vienkartinis)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/capacity_research.py
      - run: |
          git config user.name "attendance-bot"
          git config user.email "attendance-bot@users.noreply.github.com"
          git add tools/capacity_research.csv
          git commit -m "Arenų talpos tyrimas" && git pull --rebase && git push
